<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Particle Accelerator</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070d1c;--bg2:#0e1a35;--ink:#e9edf7;--mute:#9aa6c4;--gold:#d4af6a;--card:rgba(255,255,255,.045);--line:rgba(212,175,106,.28);--serif:'Playfair Display',Georgia,'Times New Roman',serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f3ec;--bg2:#e8e2d3;--ink:#16203a;--mute:#5a6580;--gold:#9a7424;--card:rgba(22,32,58,.05);--line:rgba(154,116,36,.4)}}
:root[data-theme="dark"]{--bg:#070d1c;--bg2:#0e1a35}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);color:var(--ink);background:radial-gradient(ellipse at 50% 0%,var(--bg2),var(--bg) 70%);background-color:var(--bg)}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;--iw:clamp(230px,26vw,450px);padding:50px clamp(24px,5vw,80px);opacity:0;visibility:hidden;transform:translateY(14px);transition:.55s ease;overflow-y:auto}
.slide.on{opacity:1;visibility:visible;transform:none}
.num{font:600 12px var(--sans);letter-spacing:.3em;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
h2{font:500 clamp(28px,4.2vw,52px)/1.15 var(--serif);margin-bottom:16px}
h2::after{content:"";display:block;width:64px;height:2px;background:var(--gold);margin-top:16px}
.lead{font-size:clamp(15px,1.7vw,20px);line-height:1.7;color:var(--mute);font-weight:300;max-width:860px;margin-bottom:20px}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.g h3{font:500 20px var(--serif);color:var(--gold);margin-bottom:10px}
.cards{display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;gap:14px;align-items:baseline;font-size:15px;line-height:1.5}
.card b{color:var(--ink);font-weight:600}.card span{color:var(--mute)}
.card i{font:italic 500 22px var(--serif);color:var(--gold);min-width:22px}
.wide .cards{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.cover{align-items:flex-start}
.cover h1{font:700 clamp(38px,7vw,92px)/1.05 var(--serif);letter-spacing:.02em;margin-bottom:18px}
.cover h1 em{color:var(--gold);font-style:normal}
.cover p{color:var(--mute);letter-spacing:.25em;text-transform:uppercase;font-size:13px}
/* image slots */
.slot{position:absolute;width:var(--iw);aspect-ratio:4/3;border:1px dashed var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px;text-align:center;background:var(--card);transition:.25s}
.slot:hover{border-color:var(--gold)}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot.has{border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tl{top:26px;left:26px}.tr{top:26px;right:26px}.bl{bottom:56px;left:26px}.br{bottom:56px;right:26px}
body.hideslots .slot:not(.has){display:none}
.slot{transform:rotate(var(--rot,0deg))}
.tl{--rot:-12deg}.tr{--rot:10deg}.bl{--rot:9deg}.br{--rot:-10deg}
.slot:hover{transform:rotate(0deg) scale(1.05);z-index:3}
.slot.has{padding:6px;background:#f4f1ea;border:0;box-shadow:0 14px 34px rgba(0,0,0,.45)}
.slot.has img{border-radius:3px}
.slot small{display:block;opacity:.7;margin-top:4px;font-size:10px}
.slot.drag{border-color:var(--gold);background:var(--line)}
.slot .rm{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1;cursor:pointer;opacity:0;transition:.2s}
.slot:hover .rm{opacity:1}
.tools{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:5}
.tools button{background:var(--card);color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:400 12px var(--sans);cursor:pointer}
.tools button:hover{border-color:var(--gold);color:var(--gold)}
@media(max-width:900px){.tools{display:none}}
@media(min-width:901px){.slide{overflow:hidden}.slide.has-r{padding-right:calc(var(--iw) + 90px)}.slide.has-l{padding-left:calc(var(--iw) + 90px)}}
nav{pointer-events:none}nav>*{pointer-events:auto}
.tools{opacity:.35;transition:.2s}.tools:hover{opacity:1}
@media(max-width:900px){.slide{padding:40px 22px 90px}.slot{display:none}}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;gap:18px;padding:14px calc(14px + env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;width:42px;height:42px;font-size:18px;cursor:pointer}
nav button:hover{border-color:var(--gold);color:var(--gold)}
.dots{display:flex;gap:7px}.dots b{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer}.dots b.on{background:var(--gold);transform:scale(1.4)}
#bar{position:fixed;top:0;left:0;height:2px;background:var(--gold);z-index:6;transition:width .4s}
/* game */
.game{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
canvas{width:min(100%,440px);aspect-ratio:1;border:1px solid var(--line);border-radius:50%;background:radial-gradient(circle,#0b1630,#050a16);touch-action:manipulation}
.hud{flex:1;min-width:230px}
.meter{height:12px;border-radius:99px;background:var(--card);border:1px solid var(--line);overflow:hidden;margin:6px 0 14px}
.meter div{height:100%;width:0;background:linear-gradient(90deg,#3d6dcc,var(--gold));transition:width .15s}
.stat{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin-top:4px}.stat b{color:var(--ink);font-weight:600}
.btn{margin-top:16px;background:var(--gold);color:#101830;border:0;border-radius:8px;padding:11px 22px;font:600 14px var(--sans);cursor:pointer}
#msg{margin-top:12px;min-height:44px;font-size:14px;color:var(--gold);line-height:1.5}

.quiz{max-width:760px}
.qtop{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.qq{font:500 clamp(18px,2.2vw,26px)/1.4 var(--serif);margin:6px 0 16px}
.qo{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:400 15px var(--sans);cursor:pointer;transition:.2s}
.opt:hover{border-color:var(--gold)}
.opt i{font:italic 500 18px var(--serif);color:var(--gold);min-width:20px}
.opt.right{border-color:#3fa971;background:rgba(63,169,113,.16)}
.opt.wrong{border-color:#d5584f;background:rgba(213,88,79,.16)}
#qx{min-height:48px;margin-top:14px;font-size:14px;line-height:1.6;color:var(--mute)}#qx b{color:var(--gold)}

.board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;max-width:560px;margin-top:8px}
[hidden]{display:none!important}
.tile{aspect-ratio:1.25;background:var(--card);color:var(--gold);border:1px solid var(--line);border-radius:12px;font:500 clamp(22px,3vw,34px) var(--serif);cursor:pointer;transition:.2s}
.tile:hover:not(:disabled){border-color:var(--gold);transform:translateY(-3px);background:var(--line)}
.tile:disabled{cursor:default;color:#fff}
.tile.right{background:rgba(63,169,113,.28);border-color:#3fa971}
.tile.wrong{background:rgba(213,88,79,.28);border-color:#d5584f}

.slide.qmode .num,.slide.qmode h2,.slide.qmode .lead,.slide.qmode .meter,.slide.qmode .qtop{display:none}
.slide.qmode .qq{font-size:clamp(22px,2.8vw,34px);margin-bottom:22px}
.opt.chosen{outline:2px solid var(--gold);outline-offset:2px}
.copy{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:7;font:300 11px var(--sans);letter-spacing:.1em;color:var(--mute);pointer-events:none}
@media(max-width:900px){.copy{bottom:calc(66px + env(safe-area-inset-bottom,0px))}}
</style>
</head>

const deck=document.getElementById('deck'),dots=document.getElementById('dots');
let cur=0,pendingSlot=null;
S.forEach((s,idx)=>{
  const el=document.createElement('section');el.className='slide'+(s.cover||s.thanks?' cover':'')+(s.wide?' wide':'');
  let h='';
  if(s.thanks){h='<div class="num">The End</div><h1>Thank <em>you</em></h1><p style="letter-spacing:.04em;text-transform:none;font-size:clamp(15px,1.6vw,19px);line-height:1.9;max-width:780px">Thank you, teachers and classmates, for listening.<br>If you would like to read more carefully, please visit our website to learn more: <b style="color:var(--gold)" id="siteLink"></b></p><p style="margin-top:38px">This website was created by Group 6 using HTML.</p>'}else if(s.cover){h='<div class="num">Science Presentation</div><h1>Particle<br><em>Accelerator</em></h1><p>Exploring the smallest parts of matter</p>'}
  else{
    h=`<div class="num">${s.n.length<3?'Section '+s.n:s.n}</div><h2>${s.t}</h2>`;
    if(s.lead)h+=`<p class="lead">${s.lead}</p>`;
    if(s.g)h+='<div class="groups">'+s.g.map(g=>`<div class="g">${g.h?`<h3>${g.h}</h3>`:''}<div class="cards">${g.i.map((x,k)=>Array.isArray(x)?`<div class="card">${s.num?`<i>${k+1}</i>`:''}<div><b>${x[0]}:</b> <span>${x[1]}</span></div></div>`:`<div class="card"><span style="color:var(--ink)">${x}</span></div>`).join('')}</div></div>`).join('')+'</div>';
    if(s.game)h+=`<div class="quiz"><div class="qtop"><span id="qn"></span><span id="qs"></span></div><div class="meter"><div id="qb"></div></div><div id="board" class="board"></div><div id="qpanel" hidden><div id="qq" class="qq"></div><div id="qo" class="qo"></div><div id="qx"></div></div><button class="btn" id="qnext" hidden>Back to questions</button></div>`;
  }
  el.innerHTML=h;
  (IMAGES[idx]||[]).forEach(im=>mkSlot(el,im));
  deck.appendChild(el);
  const b=document.createElement('b');b.onclick=()=>go(idx);dots.appendChild(b);
});
document.getElementById('siteLink').innerHTML=SITE_URL?`<a href="https://${SITE_URL}" target="_blank" rel="noopener" style="color:inherit">${SITE_URL}</a>`:'[your website link]';
const fileIn=document.getElementById('file');
fileIn.onchange=()=>{const f=fileIn.files[0];if(f&&pendingSlot)pendingSlot.set(URL.createObjectURL(f));fileIn.value=''};
function mkSlot(el,im){
  const d=document.createElement('div');d.className='slot '+im.pos;el.classList.add(im.pos.endsWith('r')?'has-r':'has-l');if(im.rot!==undefined)d.style.setProperty('--rot',im.rot+'deg');
  const reset=()=>{d.classList.remove('has');d.innerHTML='+ Add image<br><small>click or drag & drop</small>'};
  const set=src=>{d.classList.add('has');d.innerHTML=`<img src="${src}" alt=""><button class="rm" title="Remove image">×</button>`;d.querySelector('.rm').onclick=ev=>{ev.stopPropagation();reset()}};
  if(im.src)set(im.src);else reset();
  d.onclick=()=>{pendingSlot={set};fileIn.click()};
  d.ondragover=ev=>{ev.preventDefault();d.classList.add('drag')};
  d.ondragleave=()=>d.classList.remove('drag');
  d.ondrop=ev=>{ev.preventDefault();d.classList.remove('drag');const f=ev.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))set(URL.createObjectURL(f))};
  el.appendChild(d);return d}
function go(i){cur=Math.max(0,Math.min(S.length-1,i));[...deck.children].forEach((e,k)=>e.classList.toggle('on',k===cur));[...dots.children].forEach((e,k)=>e.classList.toggle('on',k===cur));document.getElementById('bar').style.width=(cur+1)/S.length*100+'%';if(!S[cur].game)stopGame()}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{
  if(e.key==='h'||e.key==='H'){document.body.classList.toggle('hideslots');return}
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','PageUp'].includes(e.key))go(cur-1)});

/* ===== QUIZ ===== */
const $=id=>document.getElementById(id);
const Q=[
 ['What do particle accelerators use to speed up charged particles?',['Electric fields','Sound waves','Heat','Gravity'],0,'Electric fields increase the energy and speed of the particles.'],
 ['Which component controls and focuses the particle beams?',['Detectors','Magnets','Vacuum tube','Particle source'],1,'Magnets guide and focus the beam along its path.'],
 ['Why do accelerators use a vacuum tube?',['To cool the particles','To make particles heavier','To keep the environment almost free of air','To store the results'],2,'Very little air means particles do not collide with air molecules.'],
 ['In the working process, which step comes right after Acceleration?',['Collision','Detection','Particle Production','Particle Control'],3,'The order is: Production, Acceleration, Control, Collision, Detection.'],
 ['Which accelerator moves particles in a straight line?',['LINAC','Cyclotron','Circular accelerator','Detector'],0,'LINAC stands for Linear Accelerator.'],
 ['Which accelerator moves particles along a spiral path?',['LINAC','Circular accelerator','Cyclotron','Vacuum accelerator'],2,'A cyclotron accelerates particles along a spiral path.'],
 ['Which is a medical application of particle accelerators?',['Building bridges','Cancer treatment and medical imaging','Growing crops','Making clothes'],1,'Accelerators help with cancer treatment and medical imaging.'],
 ['Where is the Large Hadron Collider (LHC) located?',['Tokyo, Japan','Chicago, USA','CERN, near Geneva','Moscow, Russia'],2,'The LHC is at CERN, near Geneva, between Switzerland and France.'],
 ['What is the approximate circumference of the LHC?',['2.7 km','27 km','270 km','2,700 km'],1,'The LHC ring is approximately 27 kilometres around.'],
 ['In which year did scientists discover the Higgs boson using the LHC?',['1998','2005','2012','2020'],2,'The Higgs boson discovery was announced in 2012.']
];
let done=[],picked=[],order=[],score=0,locked=false,open=-1;
const GS=()=>deck.children[S.findIndex(x=>x.game)];
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const allDone=()=>done.every(x=>x!==null);
function qStart(){done=Array(Q.length).fill(null);picked=[];order=[];score=0;open=-1;showBoard()}
function showBoard(){
  open=-1;GS().classList.remove('qmode');
  const n=done.filter(x=>x!==null).length;
  $('qpanel').hidden=true;$('qnext').hidden=true;
  $('qs').textContent='Score: '+score;$('qb').style.width=(n/Q.length*100)+'%';
  if(n===Q.length)return qEnd();
  $('qn').textContent='Choose a question ('+n+' / '+Q.length+' answered)';
  $('board').hidden=false;
  $('board').innerHTML=Q.map((_,i)=>`<button class="tile ${done[i]===true?'right':done[i]===false?'wrong':''}">${i+1}</button>`).join('');
  [...$('board').children].forEach((b,i)=>b.onclick=()=>showQ(i));
}
function showQ(i){
  open=i;GS().classList.add('qmode');
  const [q,o,c]=Q[i];
  if(!order[i])order[i]=shuf(o.map((t,k)=>({t,ok:k===c})));
  $('board').hidden=true;$('qpanel').hidden=false;
  $('qq').textContent=(i+1)+'. '+q;
  $('qo').innerHTML=order[i].map((x,k)=>`<button class="opt" data-ok="${x.ok?1:0}"><i>${'ABCD'[k]}</i><span>${x.t}</span></button>`).join('');
  if(done[i]===null){locked=false;[...$('qo').children].forEach((b,k)=>b.onclick=()=>pick(k));$('qx').textContent='';$('qnext').hidden=true}
  else{locked=true;showResult(i,picked[i])}
}
function showResult(i,j){
  const bs=[...$('qo').children];
  bs.forEach(b=>{if(b.dataset.ok==='1')b.classList.add('right')});
  if(done[i]===false)bs[j].classList.add('wrong');
  bs[j].classList.add('chosen');
  $('qx').innerHTML=(done[i]?'<b>Correct!</b> ':'<b>Not quite.</b> ')+Q[i][3]+'<br><b>Your answer:</b> '+order[i][j].t+'<br><b>Score: '+score+' / '+Q.length+'</b>';
  $('qnext').textContent=allDone()?'See result':'Next';$('qnext').hidden=false;
}
function pick(j){
  if(locked||open<0)return;locked=true;
  const ok=order[open][j].ok;
  picked[open]=j;done[open]=ok;if(ok)score++;
  $('qs').textContent='Score: '+score;
  showResult(open,j);
}
function qEnd(){
  GS().classList.remove('qmode');
  $('board').hidden=true;$('qpanel').hidden=false;$('qo').innerHTML='';
  const m=score>=9?'Outstanding — you are a true accelerator physicist!':score>=7?'Great job — you understand the topic well.':score>=5?'Good effort — review the slides and try again.':'Keep going — go back through the slides and try again.';
  $('qn').textContent='Finished';$('qq').textContent='Result: '+score+' / '+Q.length;$('qx').textContent=m;
  $('qnext').textContent='Play again';$('qnext').hidden=false;
}
$('qnext').onclick=()=>{if(allDone()&&$('qo').children.length===0)qStart();else showBoard()};
function stopGame(){}
addEventListener('keydown',e=>{
  if(!S[cur].game)return;
  if(!$('board').hidden&&/^[0-9]$/.test(e.key)){showQ(e.key==='0'?9:+e.key-1);return}
  if(!$('qpanel').hidden&&['1','2','3','4'].includes(e.key)&&$('qo').children[+e.key-1])pick(+e.key-1);
  if(e.key==='Enter'&&!$('qnext').hidden)$('qnext').click();
});
qStart();
go(0);
</script>
